name: CI

on:
  push:
  pull_request:

jobs:
  # composer.json's PHP minimum and composer.lock must agree, so anyone on the
  # declared minimum can install the project.
  composer-platform:
    name: Composer (declared PHP minimum)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: composer.json is valid and the lock is up to date
        run: composer validate --strict

      - name: The minimum in require.php is the one in config.platform.php
        run: |
          php -r '$c = json_decode(file_get_contents("composer.json"), true);
            $want = "^".($c["config"]["platform"]["php"] ?? "missing");
            if ($c["require"]["php"] !== $want) { fwrite(STDERR, "require.php is {$c["require"]["php"]}, config.platform.php says {$want}\n"); exit(1); }'

      - name: Every locked package runs on the declared minimum
        # Exits 1 and lists the packages if any locked package needs a newer PHP.
        run: composer why-not --locked php "$(composer config platform.php)"

      - name: Every locked package runs on this runner's PHP
        run: composer check-platform-reqs --lock

      - name: No known security advisories in the locked packages
        # Reads composer.lock only; fails on any advisory (and on abandoned
        # packages). A new advisory can turn this red with no code change:
        # update the package (TRANSPARENCY.md "Security" lists past ones).
        run: composer audit --locked --no-interaction

  # Local development and tests use SQLite (see phpunit.xml).
  tests-sqlite:
    name: Tests (SQLite)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, so the secret scan (SecretScanScriptTest) sees every commit.
          fetch-depth: 0

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install JS dependencies
        # No automatic audit: since 2026-10-21 npm's old audit endpoint can hang
        # for 5+ minutes before answering. It only ever printed a report.
        run: npm ci --no-audit --no-fund

      - name: Build front-end assets
        run: npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # Tests use SQLite in memory and the fake Claude client (see phpunit.xml),
      # so no secrets or API keys are needed here.
      - name: Run tests
        run: php artisan test

  # Production runs on Amazon RDS MySQL, so run the same suite against MySQL.
  tests-mysql:
    name: Tests (MySQL)
    runs-on: ubuntu-24.04

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppassword"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    # Throwaway credentials for the CI-only database above, not secrets.
    # These take precedence over the SQLite defaults in phpunit.xml.
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: password

    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, so the secret scan (SecretScanScriptTest) sees every commit.
          fetch-depth: 0

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # pdo_sqlite stays for the tests that check the SQLite file settings.
          extensions: mbstring, pdo_mysql, pdo_sqlite, sqlite3
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install JS dependencies
        # No automatic audit: since 2026-10-21 npm's old audit endpoint can hang
        # for 5+ minutes before answering. It only ever printed a report.
        run: npm ci --no-audit --no-fund

      - name: Build front-end assets
        run: npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test
