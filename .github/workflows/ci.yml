name: CI

on:
  push:
  pull_request:

jobs:
  # Local development and tests use SQLite (see phpunit.xml).
  tests-sqlite:
    name: Tests (SQLite)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, so the secret scan (SecretScanScriptTest) sees every commit.
          fetch-depth: 0

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install JS dependencies
        # No automatic audit: since 2026-10-21 npm's old audit endpoint can hang
        # for 5+ minutes before answering. It only ever printed a report.
        run: npm ci --no-audit --no-fund

      - name: Build front-end assets
        run: npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # Tests use SQLite in memory and the fake Claude client (see phpunit.xml),
      # so no secrets or API keys are needed here.
      - name: Run tests
        run: php artisan test

  # Production runs on Amazon RDS MySQL, so run the same suite against MySQL.
  tests-mysql:
    name: Tests (MySQL)
    runs-on: ubuntu-24.04

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppassword"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    # Throwaway credentials for the CI-only database above, not secrets.
    # These take precedence over the SQLite defaults in phpunit.xml.
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: password

    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, so the secret scan (SecretScanScriptTest) sees every commit.
          fetch-depth: 0

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # pdo_sqlite stays for the tests that check the SQLite file settings.
          extensions: mbstring, pdo_mysql, pdo_sqlite, sqlite3
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install JS dependencies
        # No automatic audit: since 2026-10-21 npm's old audit endpoint can hang
        # for 5+ minutes before answering. It only ever printed a report.
        run: npm ci --no-audit --no-fund

      - name: Build front-end assets
        run: npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test
