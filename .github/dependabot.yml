# Weekly update PRs. Dependabot PRs are NOT merged before the Nov 16, 2026
# feature freeze (CLAUDE.md); they wait until after the contest judging.
# Composer: patch and minor only. PHP is pinned at 8.4.1 and a major update
# needs Finn's say-so (CLAUDE.md).
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
